name: Daily sync rename
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the daily sync file
        run: |
          git rm index.html
          git mv canada-golf-price-watch-public.html index.html
          git config user.name "hancventures"
          git config user.email "hancventures@users.noreply.github.com"
          git commit -m "Daily sync, 2026-11-23"
          git push
